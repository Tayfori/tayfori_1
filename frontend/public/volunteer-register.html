<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gönüllü Kayıt - AFAD Gönüllü Sistemi</title>
    <link rel="stylesheet" href="../src/assets/css/styles.css">
    <style>
        .register-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #dc2626;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #dc2626;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-register:hover {
            background: #b91c1c;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #dc2626;
            text-decoration: none;
        }

        .required {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>🆘 Gönüllü Kayıt</h1>
                <p>AFAD Afet Gönüllü Sistemi'ne hoş geldiniz!</p>
                <p style="font-size: 14px; color: #666; margin-top: 10px;">
                    Kayıt olduktan sonra hesabınız yönetici onayı bekleyecektir.
                </p>
            </div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ad <span class="required">*</span></label>
                        <input type="text" id="firstName" name="first_name" required>
                    </div>

                    <div class="form-group">
                        <label>Soyad <span class="required">*</span></label>
                        <input type="text" id="lastName" name="last_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>TC Kimlik No <span class="required">*</span></label>
                    <input type="text" id="tcNo" name="tc_no" maxlength="11" pattern="[0-9]{11}" required>
                    <small style="color: #666;">11 haneli TC kimlik numaranız</small>
                </div>

                <div class="form-group">
                    <label>E-posta <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Telefon <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="05XX XXX XX XX" required>
                </div>

                <div class="form-group">
                    <label>Şifre <span class="required">*</span></label>
                    <input type="password" id="password" name="password" minlength="6" required>
                    <small style="color: #666;">En az 6 karakter</small>
                </div>

                <div class="form-group">
                    <label>Şifre Tekrar <span class="required">*</span></label>
                    <input type="password" id="passwordConfirm" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Şehir <span class="required">*</span></label>
                        <select id="city" name="city" required>
                            <option value="">Seçiniz</option>
                            <option value="Adana">Adana</option>
                            <option value="Ankara">Ankara</option>
                            <option value="İstanbul">İstanbul</option>
                            <option value="İzmir">İzmir</option>
                            <option value="Bursa">Bursa</option>
                            <option value="Antalya">Antalya</option>
                            <option value="Hatay">Hatay</option>
                            <option value="Gaziantep">Gaziantep</option>
                            <option value="Kahramanmaraş">Kahramanmaraş</option>
                            <!-- Diğer şehirler -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>İlçe</label>
                        <input type="text" id="district" name="district">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Doğum Tarihi</label>
                        <input type="date" id="birthDate" name="birth_date">
                    </div>

                    <div class="form-group">
                        <label>Cinsiyet</label>
                        <select id="gender" name="gender">
                            <option value="">Seçiniz</option>
                            <option value="Erkek">Erkek</option>
                            <option value="Kadın">Kadın</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres</label>
                    <input type="text" id="address" name="address">
                </div>

                <button type="submit" class="btn-register">
                    Kayıt Ol
                </button>
            </form>

            <div class="login-link">
                Zaten hesabınız var mı? <a href="volunteer-login.html">Giriş Yapın</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Şifre kontrolü
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                alert('Şifreler eşleşmiyor!');
                return;
            }

            // Form verilerini topla
            const formData = {
                tc_no: document.getElementById('tcNo').value,
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: password,
                city: document.getElementById('city').value,
                district: document.getElementById('district').value || null,
                address: document.getElementById('address').value || null,
                birth_date: document.getElementById('birthDate').value || null,
                gender: document.getElementById('gender').value || null
            };

            try {
                const response = await fetch(`${API_BASE}/api/volunteers/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('✅ Kayıt başarılı! Hesabınız yönetici onayı bekliyor. Onaylandığında giriş yapabilirsiniz.');
                    window.location.href = 'volunteer-login.html';
                } else {
                    alert('❌ Hata: ' + (data.detail || 'Kayıt başarısız'));
                }
            } catch (error) {
                console.error('Kayıt hatası:', error);
                alert('❌ Kayıt sırasında bir hata oluştu. Lütfen tekrar deneyin.');
            }
        });
    </script>
</body>
</html>
