<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envanter - AFAD Yönetim Sistemi</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span>🚨</span>
                <span>AFAD Yönetim Sistemi</span>
            </div>
            <nav class="nav">
                <a href="/index.html">Dashboard</a>
                <a href="/disasters.html">Afetler</a>
                <a href="/victims.html">Afetzedeler</a>
                <a href="/inventory.html">Envanter</a>
            </nav>
            <div class="user-menu">
                <span class="user-name" id="userName">Kullanıcı</span>
                <button class="btn-logout" onclick="logout()">Çıkış</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>📦 Envanter Yönetimi</h1>
            <button class="btn btn-primary" onclick="openModal('newItemModal')">
                + Yeni Malzeme
            </button>
        </div>

        <!-- Envanter Kategorileri -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon success">🍎</div>
                <div class="stat-content">
                    <h3 id="foodCount">-</h3>
                    <p>Gıda</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon info">💧</div>
                <div class="stat-content">
                    <h3 id="waterCount">-</h3>
                    <p>Su</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">🏥</div>
                <div class="stat-content">
                    <h3 id="medicalCount">-</h3>
                    <p>Tıbbi Malzeme</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon danger">⚠️</div>
                <div class="stat-content">
                    <h3 id="lowStockCount">-</h3>
                    <p>Düşük Stok</p>
                </div>
            </div>
        </div>

        <!-- Envanter Listesi -->
        <div class="card">
            <div class="card-header">📋 Malzeme Listesi</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Malzeme Adı</th>
                            <th>Kategori</th>
                            <th>Miktar</th>
                            <th>Birim</th>
                            <th>Min. Stok</th>
                            <th>Durum</th>
                            <th>Depo</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <tr>
                            <td colspan="8" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Yeni Malzeme Modal -->
    <div id="newItemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Yeni Malzeme Ekle</h2>
                <span class="modal-close" onclick="closeModal('newItemModal')">&times;</span>
            </div>

            <form id="newItemForm">
                <div class="form-group">
                    <label class="form-label">Malzeme Adı *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Kategori *</label>
                        <select name="category" class="form-control" required>
                            <option value="food">Gıda</option>
                            <option value="water">Su</option>
                            <option value="medical">Tıbbi Malzeme</option>
                            <option value="clothing">Giyim</option>
                            <option value="shelter">Barınma</option>
                            <option value="hygiene">Hijyen</option>
                            <option value="tool">Araç-Gereç</option>
                            <option value="equipment">Ekipman</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Birim *</label>
                        <input type="text" name="unit" class="form-control" placeholder="Adet, Kg, Litre, vb." required>
                    </div>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Miktar *</label>
                        <input type="number" step="0.01" name="quantity" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Min. Stok Seviyesi</label>
                        <input type="number" step="0.01" name="min_quantity" class="form-control" value="0">
                    </div>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Depo Adı</label>
                        <input type="text" name="warehouse_name" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Depo Konumu</label>
                        <input type="text" name="storage_location" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Kaydet</button>
            </form>
        </div>
    </div>

    <!-- Stok İşlemi Modal -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Stok İşlemi</h2>
                <span class="modal-close" onclick="closeModal('stockModal')">&times;</span>
            </div>

            <form id="stockForm">
                <input type="hidden" id="stockItemId" name="item_id">

                <div class="form-group">
                    <label class="form-label">İşlem Tipi *</label>
                    <select name="transaction_type" class="form-control" required>
                        <option value="in">Giriş (Stok Ekleme)</option>
                        <option value="out">Çıkış (Stok Azaltma)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Miktar *</label>
                    <input type="number" step="0.01" name="quantity" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <textarea name="reason" class="form-control" rows="2"></textarea>
                </div>

                <button type="submit" class="btn btn-success">İşlemi Kaydet</button>
            </form>
        </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        checkAuth();

        const user = getUser();
        if (user) {
            document.getElementById('userName').textContent = user.full_name;
        }

        // Envanteri yükle
        async function loadInventory() {
            try {
                const items = await api.getInventoryItems();
                const summary = await api.getInventorySummary();
                const tbody = document.getElementById('inventoryTable');

                // İstatistikleri güncelle
                document.getElementById('foodCount').textContent = summary.by_category.food || 0;
                document.getElementById('waterCount').textContent = summary.by_category.water || 0;
                document.getElementById('medicalCount').textContent = summary.by_category.medical || 0;
                document.getElementById('lowStockCount').textContent = summary.low_stock_items.length;

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Kayıt bulunamadı</td></tr>';
                } else {
                    tbody.innerHTML = items.map(item => {
                        const isLowStock = item.quantity <= item.min_quantity;
                        const statusBadge = isLowStock ? 'badge-danger' : 'badge-success';
                        const statusText = isLowStock ? '⚠️ Düşük' : '✓ Yeterli';

                        return `
                            <tr>
                                <td>${item.name}</td>
                                <td>${getCategoryLabel(item.category)}</td>
                                <td><strong>${formatNumber(item.quantity)}</strong></td>
                                <td>${item.unit}</td>
                                <td>${formatNumber(item.min_quantity)}</td>
                                <td><span class="badge ${statusBadge}">${statusText}</span></td>
                                <td>${item.warehouse_name || '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick="openStockModal(${item.id})">
                                        Stok İşlemi
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Envanter yüklenemedi:', error);
                showNotification('Envanter yüklenemedi', 'error');
            }
        }

        // Yeni malzeme formu
        document.getElementById('newItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Sayısal değerleri dönüştür
            data.quantity = parseFloat(data.quantity);
            data.min_quantity = parseFloat(data.min_quantity) || 0;

            try {
                await api.createInventoryItem(data);
                showNotification('Malzeme eklendi', 'success');
                closeModal('newItemModal');
                e.target.reset();
                loadInventory();
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });

        // Stok işlemi modal
        function openStockModal(itemId) {
            document.getElementById('stockItemId').value = itemId;
            openModal('stockModal');
        }

        // Stok işlemi formu
        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            data.item_id = parseInt(data.item_id);
            data.quantity = parseFloat(data.quantity);

            try {
                await api.createInventoryTransaction(data);
                showNotification('Stok işlemi kaydedildi', 'success');
                closeModal('stockModal');
                e.target.reset();
                loadInventory();
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });

        // Sayfa yüklendiğinde
        loadInventory();
    </script>
</body>
</html>
