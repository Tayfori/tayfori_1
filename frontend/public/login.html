<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - AFAD Yönetim Sistemi</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                🚨 AFAD
            </div>
            <h2 class="text-center mb-3">Afet Yönetim Sistemi</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Email veya Kullanıcı Adı</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Şifre</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Giriş Yap
                </button>
            </form>

            <div class="mt-2 text-center">
                <small style="color: #95a5a6;">
                    Demo Kullanıcılar:<br>
                    admin@afad.gov.tr / admin123<br>
                    koordinator@afad.gov.tr / koord123
                </small>
            </div>
        </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const data = await api.login(username, password);
                showNotification('Giriş başarılı! Yönlendiriliyorsunuz...', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });
    </script>
</body>
</html>
